name: neprodlenka

services:
  backend:
    image: ghcr.io/vragovr/neprodlenka-backend:${TAG:-latest}
    env_file: .env
    volumes:
      - ./data:/data
    restart: unless-stopped

  nginx:
    image: ghcr.io/vragovr/neprodlenka-nginx:${TAG:-latest}
    depends_on:
      - backend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      - BASE_URL
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - nginx
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
