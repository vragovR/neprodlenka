name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Install golangci-lint
        run: |
          version=$(sed -n 's/^GOLANGCI_LINT_VERSION := //p' Makefile)
          curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b "$RUNNER_TEMP/golangci-lint" "$version"
          echo "$RUNNER_TEMP/golangci-lint" >> "$GITHUB_PATH"
      - name: Lint backend
        working-directory: backend
        run: |
          go fix ./...
          go vet ./cmd/... ./internal/...
          test -z "$(gofmt -l cmd internal)"
          golangci-lint run ./...
      - run: npm run lint
        working-directory: frontend
      - run: go test ./cmd/... ./internal/...
        working-directory: backend
      - run: npm run test:unit -- --run
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: go build -o bin/neprodlenka ./cmd/neprodlenka
        working-directory: backend
      - run: npm run build
        working-directory: frontend
      - run: git diff --exit-code

  images:
    needs: test
    if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
            file: backend/Dockerfile
          - name: nginx
            context: frontend
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    concurrency: production
    permissions:
      contents: read
      packages: read
    env:
      HOST: root@${{ vars.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - run: scp compose.prod.yaml "$HOST:/opt/neprodlenka/compose.yaml"
      - run: scp Caddyfile "$HOST:/opt/neprodlenka/Caddyfile"
      - run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh "$HOST" "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          ssh "$HOST" "cd /opt/neprodlenka && docker compose pull && docker compose up -d --remove-orphans && docker image prune -f && docker logout ghcr.io"
