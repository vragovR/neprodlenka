name: neprodlenka

services:
  backend:
    build:
      context: .
      target: dev
    env_file: .env
    volumes:
      - ./data:/data
      - go-build-cache:/root/.cache/go-build
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /app
        - action: rebuild
          path: go.mod
        - action: rebuild
          path: go.sum

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    volumes:
      - .:/app
      - node-modules:/app/node_modules

  nginx:
    image: nginx:1-alpine
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      dev.orbstack.domains: neprodlenka.local
      dev.orbstack.http-port: "80"
      traefik.enable: "true"
      traefik.http.routers.neprodlenka.rule: Host(`prodlenka.test`)
      traefik.http.services.neprodlenka.loadbalancer.server.port: "80"
    depends_on:
      - backend
      - frontend

volumes:
  go-build-cache:
  node-modules:
